version: dragonguard/v1
project: dragonguard

# DragonGuard is a security gate that runs in CI with repository read access
# and writes to a findings store. That makes it a supply-chain component for
# everything it scans, so it is scored as production and critical rather than
# as an internal tool.
asset:
  name: dragonguard
  environment: production
  criticality: critical
  internet_exposed: false
  handles_pii: false
  handles_payments: false

engines:
  trivy:
    enabled: true
  opengrep:
    enabled: true
    rules:
      - ./rules
  gitleaks:
    enabled: true

# What this module ships.
#
# Both halves, because it is a binary and a library. ./cmd/... is the dragon
# CLI; ./pkg/... is the surface other projects import -- dragonguard-platform
# runs this as its scanning engine -- so a dependency reachable only from a
# package there still reaches production, somebody else's.
#
# Declaring the binary alone would be the mistake this setting exists to
# prevent, one level up: a package that ships to consumers would be scored as
# build-only because no local main happens to link it.
#
# One of the twelve is build-only: mousetrap, which cobra links only on
# Windows, and .goreleaser.yml builds linux and darwin. That is the right
# answer for this project and it is worth knowing why -- the closure is
# computed for the platform the scan runs on, so a project that released for
# Windows would need the scan to run there to see it. See "Which Go
# dependencies actually ship" in docs/configuration.md.
ships:
  - ./cmd/...
  - ./pkg/...

policies:
  - policies

baseline: .dragon-baseline.yaml

ignore:
  - bin
  - .git
  # The regression corpus is deliberately broken code, including a credential
  # fixture. Its findings are the subject of a test, not a report about this
  # repository -- leaving it in would put twenty-four intentional findings in
  # front of anyone reading real ones.
  - testdata/corpus

state_dir: .dragon
